name: Refresh nixpkgs cache snapshot

on:
  schedule:
    # Mondays at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap jobs at 6h regardless of this setting.
    # If a full nixpkgs eval across all three systems routinely runs longer
    # than that, this job will start failing and needs a bigger/self-hosted
    # runner.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve nixpkgs revision to scrape against
        id: nixpkgs
        run: |
          rev=$(nix flake metadata github:NixOS/nixpkgs --json | jq -r '.locked.rev')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Scrape cache status
        run: |
          # nix-eval-jobs prints a full Nix stack trace to stdout for every
          # removed/aliased attribute (there are thousands in nixpkgs); piped
          # live into the Actions log that burst of output gets the step
          # cancelled by GitHub's log streaming. Redirect to a file instead.
          nix shell nixpkgs#jq nixpkgs#nix-eval-jobs --command \
            bash scripts/scrape.sh "github:NixOS/nixpkgs/${{ steps.nixpkgs.outputs.rev }}" \
            > scrape.log 2>&1 || { tail -c 20000 scrape.log; exit 1; }
          tail -n 40 scrape.log

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape.log
          retention-days: 7

      - name: Upload snapshot as a release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FASTPKGS_REPO: ${{ github.repository }}
        run: |
          tag="data-$(date -u +%Y%m%d)"
          scripts/upload-release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump flake.nix to the new snapshot and nixpkgs revision
        run: |
          sed -i -E "s#releases/download/data-[0-9]{8}#releases/download/${{ steps.release.outputs.tag }}#g" flake.nix
          sed -i -E "s#(inputs\.nixpkgs\.url = \"github:NixOS/nixpkgs/)[0-9a-f]+(\")#\1${{ steps.nixpkgs.outputs.rev }}\2#" flake.nix
          nix flake lock

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.nix flake.lock; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "Bump snapshot to ${{ steps.release.outputs.tag }} (nixpkgs ${{ steps.nixpkgs.outputs.rev }})"
          git push
