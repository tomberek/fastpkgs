name: Refresh nixpkgs cache snapshot

on:
  schedule:
    # Mondays at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.nixpkgs.outputs.rev }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve nixpkgs revision to scrape against
        id: nixpkgs
        run: |
          rev=$(nix flake metadata github:NixOS/nixpkgs --json | jq -r '.locked.rev')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  scrape:
    needs: resolve
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap jobs at 6h regardless of this setting.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Scrape cache status for ${{ matrix.system }}
        env:
          # One system per job, with fewer evaluator workers, to keep peak
          # memory/disk per job low enough for a standard hosted runner.
          NIX_EVAL_JOBS_WORKERS: "2"
        run: |
          nix shell nixpkgs#jq nixpkgs#nix-eval-jobs --command \
            bash scripts/scrape.sh "github:NixOS/nixpkgs/${{ needs.resolve.outputs.rev }}" "${{ matrix.system }}" \
            2>&1 | tee scrape-${{ matrix.system }}.log

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log-${{ matrix.system }}
          path: scrape-${{ matrix.system }}.log
          retention-days: 7

      - name: Upload snapshot data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.system }}
          path: legacyPackages.${{ matrix.system }}.json.min
          retention-days: 7

  publish:
    needs: [resolve, scrape]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          merge-multiple: true

      - name: Upload snapshot as a release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FASTPKGS_REPO: ${{ github.repository }}
        run: |
          tag="data-$(date -u +%Y%m%d)"
          scripts/upload-release.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump flake.nix to the new snapshot and nixpkgs revision
        run: |
          sed -i -E "s#releases/download/data-[0-9]{8}#releases/download/${{ steps.release.outputs.tag }}#g" flake.nix
          sed -i -E "s#(inputs\.nixpkgs\.url = \"github:NixOS/nixpkgs/)[0-9a-f]+(\")#\1${{ needs.resolve.outputs.rev }}\2#" flake.nix
          nix flake lock

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.nix flake.lock; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "Bump snapshot to ${{ steps.release.outputs.tag }} (nixpkgs ${{ needs.resolve.outputs.rev }})"
          git push
